<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>居家醫療照護整合計畫查詢｜高雄縣醫師公會 健保規定查詢站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<link rel="stylesheet" href="style.css?v=eaa6c48a">
</head>
<body>
<header class="site-header">
  <p class="breadcrumb"><a href="index.html">← 高雄縣醫師公會 健保規定查詢站</a></p>
  <h1>居家醫療照護整合計畫查詢</h1>
  <p class="subtitle">全民健康保險居家醫療照護整合計畫之計畫本文與問答集（非官方網站）</p>
</header>

<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="plan" role="tab">計畫全文</button>
  <button class="tab" data-tab="qa" role="tab">問答集查詢</button>
  <button class="tab" data-tab="files" role="tab">檔案下載</button>
</nav>

<main>
  <!-- 計畫全文（現行版本，置於首位） -->
  <section id="panel-plan" class="panel active">
    <div class="toolbar">
      <input id="planSearch" type="search" placeholder="搜尋計畫內容…（例：收案條件、巴氏量表、退場機制）" autocomplete="off">
      <select id="planSection"><option value="">全部條號</option></select>
    </div>
    <p class="hint" id="planMeta"></p>
    <div id="planList" class="rule-list"></div>
    <details class="revisions" id="revBox" hidden>
      <summary>歷次公告訂定與修訂沿革</summary>
      <ul id="revList"></ul>
    </details>
  </section>

  <!-- 問答集 -->
  <section id="panel-qa" class="panel">
    <div class="stale-banner" id="staleBanner" hidden>
      <p class="stale-head" id="staleHead"></p>
      <p class="stale-body" id="staleBody"></p>
      <details id="staleRevs">
        <summary>問答集定版後的計畫修訂公告</summary>
        <ul id="staleRevList"></ul>
      </details>
    </div>
    <div class="toolbar">
      <input id="qaSearch" type="search" placeholder="搜尋問題或回答…（例：收案、部分負擔、巴氏量表）" autocomplete="off">
      <select id="qaCategory"><option value="">全部分類</option></select>
      <label class="chk"><input type="checkbox" id="citeOnly"> 僅顯示引用計畫條號者</label>
    </div>
    <p class="result-count" id="qaCount"></p>
    <p class="hint" id="qaMeta"></p>
    <div id="qaList" class="rule-list"></div>
  </section>

  <!-- 檔案下載 -->
  <section id="panel-files" class="panel">
    <ul class="file-list" id="hhFiles"></ul>
    <p class="hint">本計畫屬公告查詢性質，資料不定期更新；有新版文件時彙入重建。</p>
  </section>
</main>

<footer class="site-footer">
  <div class="credits">
    <p class="credits-org">社團法人高雄縣醫師公會 80 週年隆重呈獻</p>
    <p class="credits-author">製作者：高雄縣醫師公會　藍聖星秘書長</p>
  </div>
  <p id="hhFooterMeta"></p>
  <p class="disclaimer">本站僅供參考，實際規定以健保署公告為準；內容為公告查詢性質，不提供醫療建議。</p>
</footer>

<script src="hh.js?v=6eb0d5c2"></script>
</body>
</html>
