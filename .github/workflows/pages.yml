name: Deploy site to GitHub Pages

# 把 docs/ 發佈到 gh-pages 分支（GitHub 會以該分支作為 Pages 站台）。
# 內建 GITHUB_TOKEN 即可推送 gh-pages；首次建立分支時 GitHub 會自動啟用 Pages。

on:
  push:
    branches: [claude/nhi-drug-coverage-rules-14nnaf]
    paths: [docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "deploy: ${{ github.event.head_commit.message || 'manual dispatch' }}"
