name: Comms channel

# 供應端與處理端的訊息通道（comms/）。做兩件事：
#
# 1. 格式檢查。通道另一端是自動化的供應端，格式壞掉若沒當場擋下，
#    訊息會安靜地消失或被誤讀，而不是有人來問一句。
# 2. 把「待回覆」的訊息開成 Issue。兩端都不是常駐的——供應端每週排程跑、
#    處理端由人開啟工作階段——所以能真正喚醒另一端的只有通知到人。

on:
  push:
    branches: [claude/nhi-drug-coverage-rules-14nnaf]
    paths: ["comms/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  comms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate messages
        run: python3 scraper/comms.py validate

      - name: Summarise channel
        run: |
          {
            echo "## 通道現況"
            echo '```'
            python3 scraper/comms.py list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 固定用同一個 Issue 當看板：每次改寫內容而不是新開一個，
      # 否則每則訊息都開一張，通知很快就會被當成雜訊而被忽略。
      - name: Surface unanswered messages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "📬 供應端／處理端通道：有待回覆訊息"
        run: |
          pending=$(python3 scraper/comms.py list --unanswered)
          number=$(gh issue list --state open --search "$TITLE in:title" \
                     --json number,title \
                     --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")

          if [ "$pending" = "（沒有符合條件的訊息）" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "通道已無待回覆訊息，自動關閉。"
              echo "已關閉 #$number"
            else
              echo "無待回覆訊息，無需動作"
            fi
            exit 0
          fi

          body=$(printf '%s\n\n```\n%s\n```\n\n詳細內容：`python3 scraper/comms.py show <id>`，或直接開啟 `comms/<id>.json`。\n\n本 Issue 由 comms workflow 自動維護，待回覆訊息清空後會自動關閉。\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "以下訊息標記了需要回覆，但尚未有任何訊息以 \`in_reply_to\` 指向它們：" "$pending")

          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
            echo "已更新 #$number"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
