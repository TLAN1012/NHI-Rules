name: Update NHI data (self-hosted runner)

# 「讓 GH 自己抓官網」的可行解：排程仍由 GitHub 管理，
# 但執行在你自己網路裡的 self-hosted runner（住宅/機構 IP 可正常通過健保署 Cloudflare）。
#
# 啟用方式（一次性，約 3 分鐘）：
# 1. 到 repo Settings → Actions → Runners → New self-hosted runner，
#    在你的電腦（macOS/Windows/Linux 皆可）照指示執行三行安裝指令
# 2. runner 上線後，本 workflow 的排程即自動生效；電腦關機時本 workflow 會排隊等候，
#    每日雲端版（update-data.yml，Wayback 備援）仍照常運作互不影響
#
# 未安裝 runner 前，本 workflow 觸發只會排隊不會執行，可放著不管。

on:
  schedule:
    - cron: "30 0 * * *"   # 每日台北 08:30（避開雲端版 08:00；runner 為常開主機）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data        # 與雲端版共用群組，避免同時寫入
  cancel-in-progress: false

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 用 venv 而非 pip --user：macOS Homebrew Python 是 externally-managed，
      # pip install --user 會直接報錯
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q -r scraper/requirements.txt

      # Cloudflare 挑戰強度會隨時間浮動（2026-08-20 曾整批 403，前一日同機正常），
      # 故此步驟容錯：抓不到就退回 Wayback，不讓整個 run 失敗而完全沒更新。
      - name: Fetch from NHI website (residential IP)
        id: live
        continue-on-error: true
        run: .venv/bin/python scraper/fetch_live.py --out cache/live --pages 15

      - name: Fallback to Wayback Machine
        if: steps.live.outcome == 'failure'
        continue-on-error: true
        run: .venv/bin/python scraper/fetch_wayback.py --out cache/wayback --url-prefix lp-3258-1.html

      - name: Rebuild dataset
        run: |
          DIRS="cache/wayback"
          [ -d cache/live ] && DIRS="cache/live $DIRS"
          .venv/bin/python scraper/build_dataset.py $DIRS --out docs/data

      - name: Commit if changed
        run: |
          git config user.name "nhi-data-bot"
          git config user.email "actions@github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "資料無變化"
          else
            SOURCE="official site"
            [ "${{ steps.live.outcome }}" = "failure" ] && SOURCE="wayback fallback"
            git commit -m "chore(data): 自動更新健保公告資料（${SOURCE}, self-hosted）"
            git push
          fi

      - name: Publish docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "deploy: 自動資料更新（self-hosted）"

      - name: Report source status
        if: always()
        run: |
          if [ "${{ steps.live.outcome }}" = "failure" ]; then
            echo "::warning::官網抓取未通過（Cloudflare 挑戰），本次改用 Wayback 備援"
          else
            echo "官網直接抓取成功 ✅"
          fi
